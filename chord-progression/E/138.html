    <script>
        /* -------------------------------------------------------
           フレット文字 → 数値変換
           x  → -1 (ミュート)
           0  → 0  (開放弦)
           1–9 → 1–9
           A–O → 10–24  (大文字・小文字両対応)
        ------------------------------------------------------- */
        function charToFret(c) {
            if (c === 'x' || c === 'X') return -1;
            const code = c.toUpperCase().charCodeAt(0);
            if (code >= 65 && code <= 79) return code - 55; // A=10 … O=24
            const n = parseInt(c, 10);
            return isNaN(n) ? -1 : n;
        }

        /* -------------------------------------------------------
           barres 正規化
           - 0 は無視（仕様）
           - 文字列 "1"、数値 1、配列 [5,7]、空値 すべて number[] へ
        ------------------------------------------------------- */
        function normalizeBarres(raw) {
            if (raw === null || raw === undefined || raw === '') return [];
            const arr = Array.isArray(raw) ? raw : String(raw).split(',');
            return arr
                .map(x => Number(String(x).trim()))
                .filter(n => Number.isFinite(n) && n > 0); // 0 は除外
        }

        /* -------------------------------------------------------
           generateFromJson
           JSON オブジェクトを受け取り、指定 id の要素に描画する
        ------------------------------------------------------- */
        function generateFromJson(j, id, name) {
            const svgStr = buildDiagram(j);

            const div = document.getElementById(id);
            div.innerHTML = '';
            const card = document.createElement('div');
            card.className = 'diagram-card';

            if (name) {
                const nm = document.createElement('div');
                nm.className = 'chord-name';
                nm.textContent = name;
                card.appendChild(nm);
            }

            const frets = j.frets;
            const fingers = j.fingers;
            const barres = normalizeBarres(j.barres);

            const hint = document.createElement('div');
            hint.className = 'json-hint';
            // hint.textContent = `frets: ${frets}  fingers: ${fingers}${barres.length ? '  barres: ' + barres.join(',') : ''}`;
            hint.textContent = j.hint;
            card.appendChild(hint);

            card.insertAdjacentHTML('beforeend', svgStr);
            div.appendChild(card);
        }


        /* -------------------------------------------------------
           SVG builder
           { frets, fingers, barres } を受け取り SVG 文字列を返す
        ------------------------------------------------------- */
        function buildDiagram(j) {
            const fretsRaw = String(j.frets);
            const fingers = String(j.fingers);
            const barres = normalizeBarres(j.barres);

            const STRING_COUNT = 6;
            const FRET_ROWS = 5;

            // 各弦のフレット番号に変換 (-1=ミュート, 0=開放, 1–24=フレット)
            const fretNums = fretsRaw.split('').map(charToFret);
            const fingerNums = fingers.split('').map(c => parseInt(c, 10) || 0);

            // --- ウィンドウ開始フレットを決定 ---
            // 押さえているフレット（ミュート・開放除く）の最小値をウィンドウ先頭に
            const played = fretNums.filter(f => f > 0);
            const minFret = played.length ? Math.min(...played) : 1;
            const maxFret = played.length ? Math.max(...played) : 1;

            // ナット表示は winStart===1 のときのみ
            // minFret が 1 ならウィンドウを 1 始まり（ナット表示）
            // それ以外は minFret 始まり
            const winStart = minFret <= 1 ? 1 : minFret;
            const showNut = winStart === 1;

            // Layout
            const LEFT = 44;
            const TOP = 52;
            const CW = 36;
            const RH = 32;
            const GRID_W = CW * (STRING_COUNT - 1); // 180
            const GRID_H = RH * FRET_ROWS;          // 160
            const W = LEFT + GRID_W + 52;      // 右に少し余裕（frラベル用）
            const H = TOP + GRID_H + 36;

            const sx = i => LEFT + i * CW;
            const fy = f => TOP + (f - winStart) * RH + RH / 2;
            const DOT = 11;

            const cText = 'var(--text-primary)';
            const cSecond = 'var(--text-secondary)';
            const cTertiary = 'var(--text-tertiary)';
            const cBorder = 'var(--border-strong)';
            const cAccent = 'var(--accent)';
            const fontSans = "var(--font-sans)";

            let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" aria-label="コードダイアグラム">`;

            /* --- ナット or フレット番号ラベル --- */
            if (showNut) {
                // ナット（太い横棒）
                s += `<rect x="${LEFT - 1}" y="${TOP - 5}" width="${GRID_W + 2}" height="6" rx="2" fill="${cText}" opacity="0.85"/>`;
            } else {
                // 各フレット行の左に番号を表示
                for (let row = 0; row < FRET_ROWS; row++) {
                    const fNum = winStart + row;
                    const y = TOP + row * RH + RH / 2;
                    // 番号ラベルを左外側に
                    s += `<text x="${LEFT - 8}" y="${y}" text-anchor="end" dominant-baseline="central" font-size="11" fill="${cSecond}" font-family="${fontSans}">${fNum}</text>`;
                }
            }

            /* --- フレット線 --- */
            for (let f = 0; f <= FRET_ROWS; f++) {
                const y = TOP + f * RH;
                s += `<line x1="${LEFT}" y1="${y}" x2="${LEFT + GRID_W}" y2="${y}" stroke="${cBorder}" stroke-width="0.5"/>`;
            }

            /* --- 弦線 --- */
            for (let i = 0; i < STRING_COUNT; i++) {
                s += `<line x1="${sx(i)}" y1="${TOP}" x2="${sx(i)}" y2="${TOP + GRID_H}" stroke="${cBorder}" stroke-width="0.75"/>`;
            }

            /* --- バレーバー --- */
            barres.forEach(bFret => {
                // ウィンドウ外のバレーは描画しない
                if (bFret < winStart || bFret >= winStart + FRET_ROWS) return;
                const y = fy(bFret);
                const x1 = LEFT - DOT * 0.5;
                const bw = GRID_W + DOT;
                s += `<rect x="${x1}" y="${y - DOT}" width="${bw}" height="${DOT * 2}" rx="${DOT}" fill="${cAccent}"/>`;
                // 指番号
                const cands = fingerNums.filter((fn, i) => fretNums[i] === bFret && fn > 0);
                const fi = cands.length ? Math.min(...cands) : null;
                if (fi) {
                    s += `<text x="${x1 + DOT}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#ffffff" font-family="${fontSans}">${fi}</text>`;
                }
            });

            /* --- 各弦マーカー --- */
            for (let i = 0; i < STRING_COUNT; i++) {
                const f = fretNums[i];
                const fi = fingerNums[i];
                const cx = sx(i);
                const oy = TOP - 20; // ミュート・開放シンボルの y

                if (f === -1) {
                    // ミュート ×
                    const d = 5;
                    s += `<line x1="${cx - d}" y1="${oy - d}" x2="${cx + d}" y2="${oy + d}" stroke="${cSecond}" stroke-width="1.4" stroke-linecap="round"/>`;
                    s += `<line x1="${cx + d}" y1="${oy - d}" x2="${cx - d}" y2="${oy + d}" stroke="${cSecond}" stroke-width="1.4" stroke-linecap="round"/>`;
                } else if (f === 0) {
                    // 開放弦 ○
                    s += `<circle cx="${cx}" cy="${oy}" r="6" fill="none" stroke="${cSecond}" stroke-width="1.2"/>`;
                } else {
                    // バレーで覆われているフレットは個別ドット不要
                    const coveredByBarre = barres.includes(f);
                    if (!coveredByBarre) {
                        const cy = fy(f);
                        s += `<circle cx="${cx}" cy="${cy}" r="${DOT}" fill="${cAccent}"/>`;
                        if (fi > 0) {
                            s += `<text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#ffffff" font-family="${fontSans}">${fi}</text>`;
                        }
                    }
                }
            }

            /* --- 弦ラベル (EADGBE) --- */
            const stringLabels = ['E', 'A', 'D', 'G', 'B', 'e'];
            for (let i = 0; i < STRING_COUNT; i++) {
                s += `<text x="${sx(i)}" y="${TOP + GRID_H + 18}" text-anchor="middle" font-size="10" fill="${cTertiary}" font-family="${fontSans}">${stringLabels[i]}</text>`;
            }

            s += `</svg>`;
            return s;
        }

    </script>

        crossorigin="anonymous" defer></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const buttons = document.querySelectorAll('.image-change-btn');
        const images = document.querySelectorAll('.select-image');

        // 表示を切り替える共通関数
        const updateDisplay = (targetImageClass) => {
            buttons.forEach(btn => {
                const isActive = btn.getAttribute('data-image') === targetImageClass;
                btn.classList.toggle('active', isActive);
                btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
            });

            images.forEach(img => {
                // 画像が対象のクラスを持っているか確認
                if (img.classList.contains(targetImageClass)) {
                    img.classList.add('is-visible');
                } else {
                    img.classList.remove('is-visible');
                }
            });
        };

        // --- 初期化処理 ---
        const activeBtn = document.querySelector('.image-change-btn.active');
        if (activeBtn) {
            updateDisplay(activeBtn.getAttribute('data-image'));
        }

        // --- イベントリスナー ---
        buttons.forEach(button => {
            button.addEventListener('click', (e) => {
                updateDisplay(e.currentTarget.getAttribute('data-image'));
            });
        });
    });
</script>
