<?xml version="1.0" standalone="no"?>

<svg xmlns="http://www.w3.org/2000/svg"
     id="svg-canvas"
     width="1280.00" height="1280.00" viewBox="0.00 0.00 1280.00 1280.00">

    <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
             xmlns:dc="http://purl.org/dc/elements/1.1/">
        <rdf:Description rdf:about="">
            <dc:format>image/svg+xml</dc:format>
            <dc:title>BTRKITA icon</dc:title>
            <dc:creator>
                <rdf:Bag>
                    <rdf:li>Suzunone（https://btrkita.github.io/）</rdf:li>
                </rdf:Bag>
            </dc:creator>
            <dc:rights>
                <rdf:Alt>
                    <rdf:li xml:lang="x-default">Copyright © 2024 https://btrkita.github.io/ All rights reserved.
                    </rdf:li>
                </rdf:Alt>
            </dc:rights>
        </rdf:Description>
    </rdf:RDF>
</metadata>

    <rect height="1280.00" width="1280.00" id="fill" fill="#fff"/>


    <defs>
        <!-- 背景：ピックを引き立てる重厚なダークグレー -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#111116"/>
            <stop offset="100%" stop-color="#1c1c24"/>
        </linearGradient>
        <!-- ピック本体：熱量を感じるエレクトリック・レッドのグラデーション -->
        <linearGradient id="pickGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff0055"/>
            <stop offset="100%" stop-color="#990033"/>
        </linearGradient>
    </defs>

    <!-- 角丸の背景ベース -->
    <rect width="1280" height="1280" rx="280" fill="url(#bgGrad)"/>

    <!-- ピック本体（前々回より「ちょっとだけ」大きく調整、中央配置） -->
    <g transform="rotate(-15 640 640)">
        <!-- ほどよい余白を残しつつ、存在感を少しアップした形状 -->
        <path d="M 640 120
             C 1100 120, 1180 410, 940 880
             C 810 1130, 700 1190, 640 1190
             C 580 1190, 470 1130, 340 880
             C 100 410, 180 120, 640 120 Z"
              style="fill: url(#pickGrad); filter: drop-shadow(0px 15px 30px rgba(0,0,0,0.5));"/>

        <!-- ピック内のテキスト（BTR）：ピックの拡大に合わせてほんの少しだけサイズアップ -->
        <g fill="#ffffff" stroke="#990033" stroke-width="15" stroke-linejoin="round">
            <!-- B -->
            <path
                d="M 360 470 H 480 C 540 470, 570 495, 570 540 C 570 570, 550 595, 510 600 C 560 605, 585 630, 585 675 C 585 725, 545 755, 470 755 H 360 Z M 425 520 V 565 H 470 C 490 565, 500 555, 500 540 C 500 525, 490 520, 470 520 Z M 425 615 V 705 H 475 C 495 705, 515 690, 515 660 C 515 630, 495 615, 475 615 Z"/>
            <!-- T -->
            <path d="M 590 470 H 745 V 530 H 645 V 755 H 575 V 530 H 590 Z"/>
            <!-- R -->
            <path
                d="M 740 470 H 860 C 920 470, 950 495, 950 550 C 950 595, 925 620, 870 625 L 960 755 H 875 L 795 635 H 740 V 755 H 670 Z M 740 520 V 580 H 845 C 865 580, 875 570, 875 550 C 875 530, 865 520, 845 520 Z"/>
        </g>
    </g>
</svg>
